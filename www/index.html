<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>日常百宝箱</title>
  <script src="jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- 页面 1：餐饮含税计算器 -->
  <div id="page-tax" class="page active">
    <h2>餐饮含税计算器</h2>
    <div class="card">
      <label>食物价钱 (Price)</label>
      <div class="input-row">
        <span class="prefix">RM</span>
        <input id="price" type="text" inputmode="text" placeholder="如: 12.5+8.9" autofocus />
      </div>
    </div>
    <div class="card">
      <label>税率 (Tax %)</label>
      <div class="input-row">
        <input id="tax" type="number" inputmode="decimal" step="0.1" value="16" />
        <span class="prefix">%</span>
      </div>
      <div class="presets">
        <button type="button" data-tax="16">16%</button>
        <button type="button" data-tax="6">6%</button>
        <button type="button" data-tax="10">10%</button>
        <button type="button" data-tax="0">0%</button>
      </div>
    </div>
    <div class="result-box">
      <div class="total-label">实际应付总额</div>
      <div class="total-val" id="total">RM 0.00</div>
      <div class="detail-row">
        <span style="flex:1; text-align:left;">税前: <strong id="basePrice">RM 0.00</strong></span>
        <span style="flex:1; text-align:center;">税额: <strong id="taxAmt">RM 0.00</strong></span>
        <span style="flex:1; text-align:right;">凑整: <strong id="cashRound">RM 0.00</strong></span>
      </div>
    </div>
    <button type="button" class="btn btn-gray" data-action="clear-price">清空价钱</button>
  </div>

  <!-- 页面 2：扫描 & 照片转 PDF（合并版） -->
  <div id="page-scanpdf" class="page">
    <h2>📷 扫描 & 照片转 PDF</h2>

    <!-- 全局保存路径选择条（共用） -->
    <div class="path-bar">
      <div class="path-bar-left">
        <div class="path-bar-title">📂 当前保存文件夹（扫描 / PDF 共用）</div>
        <div class="path-bar-val" data-path-display>未选择（点击选择系统文件夹）</div>
      </div>
      <button type="button" class="path-bar-btn">选择 Path</button>
    </div>

    <!-- ===== 扫描部分 ===== -->
    <div class="section-divider">📄 离线文件扫描</div>

    <!-- 步骤 1：上传 -->
    <div id="scan-step-upload" class="card">
      <input id="scanInput" type="file" accept="image/*" style="display:none" />
      <button type="button" class="btn btn-green" style="margin-top:0; padding:18px; font-size:17px;" data-action="take-photo">
        📷 直接拍照扫描
      </button>
      <button type="button" class="btn btn-gray" data-action="pick-album">
        🖼️ 从相册选择照片
      </button>
      <div class="hint-text" style="margin-top:12px;">自动识别纸张边缘 · 拖动十字放大镜微调 · 存入指定文件夹</div>
    </div>

    <!-- 步骤 2：框选 -->
    <div id="scan-step-crop" class="card" style="display:none">
      <div class="canvas-wrap">
        <canvas id="cropCanvas"></canvas>
      </div>
      <div class="hint-text" id="detectHint">已自动识别纸张边缘，按住绿点拖动可开启放大镜微调</div>
      <div class="btn-row">
        <button type="button" class="btn btn-sm btn-gray" data-action="reset-scan">重选</button>
        <button type="button" class="btn btn-sm btn-blue" data-action="auto-detect">✨ 自动框选</button>
        <button type="button" class="btn btn-sm btn-gray" data-action="select-full">全图</button>
        <button type="button" class="btn btn-sm btn-green" data-action="process-perspective">确认拉正</button>
      </div>
    </div>

    <!-- 步骤 3：滤镜与保存 -->
    <div id="scan-step-result" class="card" style="display:none">
      <div class="canvas-wrap">
        <canvas id="resultCanvas"></canvas>
      </div>
      <div class="filter-bar">
        <button type="button" id="flt-enhance" class="active" data-filter="enhance">增强扫描</button>
        <button type="button" id="flt-hd" data-filter="hd">高清扫描</button>
        <button type="button" id="flt-bw" data-filter="bw">纯黑白</button>
        <button type="button" id="flt-orig" data-filter="orig">原图</button>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-gray" data-action="back-to-crop">重新调角</button>
        <button type="button" id="saveScanBtn" class="btn btn-green">存入文件夹</button>
      </div>
      <button type="button" class="btn btn-blue" style="margin-top:8px;" data-action="add-scan-to-pdf">
        ➕ 将当前扫描页加入 PDF 列表
      </button>
    </div>

    <!-- ===== PDF 部分 ===== -->
    <div class="section-divider">📑 照片转 PDF</div>

    <div class="card">
      <label>PDF 文件名</label>
      <div class="input-row">
        <input id="pdfName" type="text" placeholder="留空则自动按时间命名" />
      </div>
    </div>

    <div class="card">
      <input id="fileInput" type="file" accept="image/*" multiple style="display:none" />
      <div class="upload-area" data-action="pick-pdf-images">
        <strong>+ 点击选择照片（支持多选）</strong>
        <span>可调整前后顺序，合成 A4 PDF</span>
      </div>
      <div id="imgList" class="img-list"></div>
    </div>

    <div class="merged-toolbar">
      <button type="button" id="genPdfBtn" class="btn btn-green" style="flex:2;" disabled data-action="generate-pdf">
        生成并存入文件夹 (0 张)
      </button>
      <button type="button" class="btn btn-gray" style="flex:1;" data-action="clear-pdf-images">
        清空所有照片
      </button>
    </div>
    <div class="hint-text" style="margin-top:4px;">扫描完成后点击“存入文件夹”保存图片，或点击“加入PDF列表”直接合成PDF</div>
  </div>

  <!-- 路径选择弹窗 -->
  <div id="pathModal" class="modal-mask">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3>选择保存文件夹</h3>
        <button type="button" class="modal-close" data-action="close-path-modal">✕</button>
      </div>
      <button type="button" class="btn btn-green" style="margin-top:0; margin-bottom:14px;" data-action="pick-dir">
        📂 打开手机文件夹选择器（新增/授权目录）
      </button>
      <label>已授权的历史文件夹（点击直接切换，无需重复授权）</label>
      <div id="pathHistoryList" class="history-list"></div>
    </div>
  </div>

  <!-- 底部导航（改为两个 Tab） -->
  <div class="tab-bar">
    <button type="button" class="tab-item active" data-tab="tax">
      <span class="tab-icon">🧮</span>
      <span>餐饮算税</span>
    </button>
    <button type="button" class="tab-item" data-tab="scanpdf">
      <span class="tab-icon">📷</span>
      <span>扫描 & PDF</span>
    </button>
  </div>

  <!-- 模块脚本 -->
  <script src="js/saf.js"></script>
  <script src="js/common.js"></script>
  <script src="js/tax.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
