name: Build Offline APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install & Build Android Project
        run: |
          npm install
          npx cap init "日常百宝箱" "com.yozor.toolbox" --web-dir www
          npx cap add android
          npx cap sync
          sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.CAMERA" \/><\/manifest>/' android/app/src/main/AndroidManifest.xml
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../日常百宝箱.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 日常百宝箱-APK
          path: 日常百宝箱.apk
